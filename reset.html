<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reinicia DocentCat</title><style>body{font-family:Arial,sans-serif;max-width:680px;margin:40px auto;padding:20px;line-height:1.45;color:#172033}button{background:#253b80;color:#fff;border:0;border-radius:12px;padding:12px 18px;font-weight:700}</style></head><body><h1>Reiniciant DocentCat...</h1><p>Aquesta pàgina esborra la memòria cau de la PWA i torna a obrir l'aplicació neta.</p><button id="go">Reinicia ara</button><script>async function reset(){try{if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();for(const r of regs) await r.unregister();} if(window.caches){const keys=await caches.keys();for(const k of keys) await caches.delete(k);} localStorage.removeItem('docentcat-pwa-v2-curriculum');}catch(e){console.error(e)} location.href='./?v=no-sw-print-v3-'+Date.now()} document.getElementById('go').onclick=reset; reset();</script></body></html>
